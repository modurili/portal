<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="もづりぃの作品ポータル。" />
    <title>Modurili OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="desktop" id="desktop" aria-label="Modurili OS desktop">
      <div class="desktop-icons" id="desktop-icons" aria-live="polite"></div>
      <div class="window-layer" id="window-layer" aria-live="polite"></div>
    </main>
    <nav class="taskbar" aria-label="Taskbar">
      <button class="start-button" type="button" id="start-button">Modurili</button>
      <div class="taskbar-apps" id="taskbar-apps"></div>
      <time class="taskbar-clock" id="taskbar-clock"></time>
    </nav>
    <div class="start-menu is-hidden" id="start-menu">
      <button type="button" data-start-app="all">All Works</button>
      <button type="button" data-start-app="links">Links</button>
    </div>
    <noscript>
      <p class="boot-error">JavaScriptを有効にしてください。</p>
    </noscript>

    <script src="./script.js"></script>
  </body>
</html>
